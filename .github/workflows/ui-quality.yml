name: UI Quality

on:
  pull_request:
    paths:
      - "governance-ui/**"
      - ".github/workflows/ui-quality.yml"
  push:
    branches:
      - main
    paths:
      - "governance-ui/**"
      - ".github/workflows/ui-quality.yml"

permissions:
  contents: read

jobs:
  checks:
    name: lint-build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: governance-ui

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: governance-ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
