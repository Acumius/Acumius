version: '3.8'

services:
  acumius:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: acumius-core
    ports:
      - "${ACUMIUS_SERVER_PORT:-8080}:8080"
    environment:
      - ACUMIUS_SERVER_PORT=${ACUMIUS_SERVER_PORT:-8080}
      - ACUMIUS_DATABASE_URL=${ACUMIUS_DATABASE_URL:-postgres://acumius:acumius@postgres:5432/acumius?sslmode=disable}
      - ACUMIUS_VALKEY_URL=${ACUMIUS_VALKEY_URL:-valkey:6379}
      - ACUMIUS_LOG_LEVEL=${ACUMIUS_LOG_LEVEL:-info}
      - ACUMIUS_ENV=${ACUMIUS_ENV:-development}
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - acumius-network

  postgres:
    image: ankane/pgvector:latest
    container_name: acumius-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-acumius}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-acumius}
      POSTGRES_DB: ${POSTGRES_DB:-acumius}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-acumius} -d ${POSTGRES_DB:-acumius}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - acumius-network

  valkey:
    image: valkey/valkey:8
    container_name: acumius-valkey
    ports:
      - "${VALKEY_PORT:-6379}:6379"
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks:
      - acumius-network

